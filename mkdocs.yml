site_name: Coxswain
site_description: Multi-agent epic orchestration for Claude Code and Codex - leader/worker, epics, stories, arena design review, on a durable event log.
site_url: https://nphattai.github.io/coxswain/
repo_url: https://github.com/nphattai/coxswain
repo_name: nphattai/coxswain
theme:
  name: material
  custom_dir: docs/overrides
  font: false
  logo: assets/brand/wordmark.svg
  favicon: assets/brand/favicon.svg
  language: en
  palette:
    scheme: default
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.suggest
extra:
  generator: false
extra_css:
  - assets/stylesheets/coxswain.css
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc: { permalink: true }
exclude_docs: |
  workflow.md
  baselines/
  overrides/
extra_javascript:
  - assets/javascripts/accessibility.js
nav:
  - Home: index.md
  - Set up:
    - Install: getting-started/install.md
    - Create a workspace: getting-started/workspace.md
    - First epic: getting-started/first-epic.md
  - Operate:
    - Operating map: operations/index.md
    - Design and sign: arena.md
    - Dispatch, supervise, recover: handoff.md
    - Monitor an epic: board.md
    - Troubleshooting: faq.md
    - Tuning and migration:
      - Worker routing: routing.md
      - Quota: quota.md
      - Policy experiments: lab.md
      - Review visual artifacts: review.md
      - Migrate from v1: migrate.md
  - Reference:
    - CLI map: reference/cli.md
    - workspace.json: reference/workspace-json.md
    - policy.json: reference/policy-json.md
    - Story frontmatter: reference/story-frontmatter.md
    - Configuration: reference/configuration.md
  - Understand:
    - Product model: getting-started/concepts.md
    - System architecture: ARCHITECTURE.md
    - Adapter model:
      - adapters/index.md
      - Backends:
        - Orca: adapters/orca.md
        - Herdr: adapters/herdr.md
      - Harnesses:
        - Claude Code: adapters/claude.md
        - Codex: adapters/codex.md
      - Integrations:
        - GitHub: adapters/github.md
        - Project services: adapters/service.md
        - quota-axi: adapters/quota-axi.md
        - lavish-axi: adapters/lavish.md
    - Protocol model:
      - protocol/index.md
      - Event log: protocol/event.v1.md
      - Fleet view: protocol/fleet.v1.md
      - Inbox: protocol/inbox.v1.md
      - Checkpoint: protocol/checkpoint.v1.md
      - Wake queue: protocol/wake.v1.md
      - Quota reading: protocol/quota.v1.md
  - Extend:
    - Contributing: contributing.md
    - Author an adapter: contributing/adapters.md
  - Decisions and evidence:
    - Architecture decisions: decisions/index.md
    - Verification evidence: evidence/index.md
