name: ci
on:
  # A story branch runs through its PR; push runs only the integration branches (B-76: every story push used to queue
  # the push and pull_request matrices both).
  push:
    branches: [main, 'epic/**']
  pull_request:

# One run per ref: a new push to a PR or epic branch cancels the superseded run instead of queueing behind it on macOS.
# main keeps every run, so each merge there still gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # v2 core: build and test the Go skeleton, and syntax-check the v1 scripts, on both platforms.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go test ./...
      - name: bash -n over v1 scripts
        run: for f in bin/*.sh; do bash -n "$f"; done

  # Pi extension (internal/adapter/harness/pi/extension): the lifecycle suites against a faithful fake of the Pi 0.86.1
  # session, the extension as `cox workspace init` installs it against the real built cox (dogfood F-4 passed every
  # fake-cox test and hung a real Pi leader), and a type-check against the pinned Pi package.
  pi-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5 @earendil-works/pi-coding-agent@0.86.1
      - run: bash tests/pi-extension/run.sh

  # Onboarding E2E (DESIGN §7): the setup journey from an empty folder to a dispatched story and back via attach, run
  # hermetically with a fake orca and a fake harness (no network, no real Orca). Guards the one-command setup contract.
  onboarding-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make build
      - run: bash tests/e2e/onboarding.sh

  # v1 kit test suite. It exercises macOS-native tooling (simulators, APFS `cp -c`, `stat -f`, `sed -i ''`), so it runs
  # on macOS only; ubuntu coverage of the scripts is the syntax check above (docs/decisions/0006: v1 is frozen).
  bash-suite:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bin/test suite
        run: for t in bin/test/*.sh; do echo "== $t"; bash "$t"; done

  # Plugin manifest: the .claude-plugin and hooks/skills/agents must stay installable from the marketplace.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: claude plugin validate .

  # Release build: goreleaser snapshot must produce the four binaries (darwin/linux x amd64/arm64) with the runtime
  # assets archived. It does not publish (snapshot); a tagged release job is added when the captain cuts the first tag.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: assert four binaries
        run: |
          n=$(find dist -type f -name cox | wc -l | tr -d ' ')
          echo "built $n cox binaries"
          test "$n" -eq 4
