<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Story lifecycle</title>
  <desc id="desc">A story moves from submitted to working. It can wait for input or park with a checkpoint, resume as a new attempt, and finish as completed, failed, or canceled.</desc>
  <defs>
    <marker id="life-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#606b74"/></marker>
    <marker id="life-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a82b35"/></marker>
    <style>
      text{font-family:"IBM Plex Sans","Segoe UI",sans-serif;fill:#182027}
      .title{font-size:16px;font-weight:600}.copy{font-size:12.5px;fill:#59656e}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11.5px;fill:#59656e}.lane{font-size:11.5px;font-weight:600;letter-spacing:1.2px;fill:#59656e}
      .state{fill:#f9faf9;stroke:#aeb8bf;stroke-width:1.25}.active{stroke:#a82b35;stroke-width:2}.terminal{fill:#edf1f2;stroke:#606b74;stroke-width:1.25}.attempt{fill:#f9faf9;stroke:#315f89;stroke-width:1.5}
      .flow{fill:none;stroke:#606b74;stroke-width:1.5;marker-end:url(#life-arrow)}.decision{fill:none;stroke:#a82b35;stroke-width:1.5;marker-end:url(#life-arrow-red)}.guide{fill:none;stroke:#cbd2d6;stroke-width:1.25}
    </style>
  </defs>

  <text class="lane" x="24" y="28">ACTIVE ATTEMPT</text>
  <rect class="state" x="24" y="52" width="160" height="56" rx="28"/>
  <rect class="state active" x="232" y="52" width="176" height="56" rx="28"/>
  <rect class="state" x="456" y="52" width="184" height="56" rx="28"/>
  <text class="title" x="104" y="85" text-anchor="middle">submitted</text>
  <text class="title" x="320" y="85" text-anchor="middle">working</text>
  <text class="title" x="548" y="85" text-anchor="middle">input required</text>
  <path class="flow" d="M184 80h48"/>
  <text class="mono" x="208" y="67" text-anchor="middle">dispatch</text>
  <path class="flow" d="M408 69h48"/>
  <path class="flow" d="M456 94h-48"/>
  <text class="mono" x="432" y="56" text-anchor="middle">ask</text>
  <text class="mono" x="432" y="116" text-anchor="middle">reply</text>

  <text class="lane" x="24" y="178">RECOVERY PATH</text>
  <rect class="attempt" x="24" y="206" width="160" height="64"/>
  <rect class="state" x="232" y="210" width="176" height="56" rx="28"/>
  <text class="title" x="104" y="233" text-anchor="middle">attempt N+1</text>
  <text class="copy" x="104" y="252" text-anchor="middle">same worktree</text>
  <text class="title" x="320" y="243" text-anchor="middle">parked</text>
  <path class="flow" d="M320 108v102"/>
  <text class="mono" x="334" y="158">checkpoint + confirmed stop</text>
  <path class="flow" d="M232 238h-48"/>
  <path class="flow" d="M104 206v-66h152v-32"/>
  <text class="mono" x="116" y="130">resume</text>

  <text class="lane" x="736" y="28">TERMINAL OUTCOMES</text>
  <rect class="terminal" x="736" y="52" width="200" height="56"/>
  <rect class="terminal" x="736" y="198" width="200" height="56"/>
  <rect class="terminal" x="736" y="286" width="200" height="56"/>
  <text class="title" x="836" y="77" text-anchor="middle">completed</text>
  <text class="copy" x="836" y="96" text-anchor="middle">captain confirmed merge</text>
  <text class="title" x="836" y="223" text-anchor="middle">failed</text>
  <text class="copy" x="836" y="242" text-anchor="middle">reason recorded</text>
  <text class="title" x="836" y="311" text-anchor="middle">canceled</text>
  <text class="copy" x="836" y="330" text-anchor="middle">captain dropped scope</text>

  <path class="flow" d="M640 80h96"/>
  <text class="mono" x="688" y="67" text-anchor="middle">done</text>
  <path class="guide" d="M688 80v234"/>
  <circle cx="688" cy="80" r="3.5" fill="#606b74"/>
  <path class="decision" d="M688 226h48"/>
  <path class="decision" d="M688 314h48"/>
  <text class="mono" x="676" y="214" text-anchor="end">retries end</text>
  <text class="mono" x="676" y="302" text-anchor="end">captain cancels</text>

  <path d="M24 382h912" stroke="#cbd2d6"/>
  <text class="copy" x="24" y="404">Every transition is an append-only event. External effects are confirmed before ownership is released.</text>
</svg>
